<!DOCTYPE html>
<html>
<head>
    <title>Sélection des Colonnes X et Y</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h3>Sélection des colonnes X et Y</h3>
        <form action="/integrate" method="post">
            <input type="hidden" name="table_name" value="{{ table_name }}">
            <input type="hidden" name="file_path" value="{{ file_path }}">
            
            <div class="mb-3">
                <label for="x_col" class="form-label">Colonne X :</label>
                <select name="x_col" class="form-select" required>
                    {% for column in columns %}
                        <option value="{{ column }}">{{ column }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="y_col" class="form-label">Colonne Y :</label>
                <select name="y_col" class="form-select" required>
                    {% for column in columns %}
                        <option value="{{ column }}">{{ column }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-success">Intégrer</button>
        </form>
    </div>
</body>
</html>
