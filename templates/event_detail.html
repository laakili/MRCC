{% extends "base.html" %}

{% block title %}Détails de l'événement - MRCC Maroc{% endblock %}

{% block extra_css %}
<style>
    .detail-container {
        padding: 30px 0;
        background: #f8f9fa;
        min-height: calc(100vh - 200px);
    }
    
    .detail-card {
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        overflow: hidden;
    }
    
    .detail-header {
        background: linear-gradient(135deg, #001F4D, #0a2d6d);
        color: white;
        padding: 20px 25px;
    }
    
    .detail-section {
        padding: 20px 25px;
        border-bottom: 1px solid #e9ecef;
    }
    
    .section-title {
        color: #001F4D;
        font-weight: 600;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #C9A94A;
    }
    
    .info-row {
        display: flex;
        padding: 8px 0;
        border-bottom: 1px solid #f0f0f0;
    }
    
    .info-label {
        width: 180px;
        font-weight: 600;
        color: #495057;
    }
    
    .info-value {
        flex: 1;
        color: #212529;
    }
    
    .priority-critical { background: #7b1fa2; color: white; padding: 3px 10px; border-radius: 20px; }
    .priority-high { background: #dc3545; color: white; padding: 3px 10px; border-radius: 20px; }
    .priority-normal { background: #ffc107; color: #856404; padding: 3px 10px; border-radius: 20px; }
    .priority-low { background: #28a745; color: white; padding: 3px 10px; border-radius: 20px; }
    
    .status-active { background: #ffc107; color: #856404; padding: 3px 10px; border-radius: 20px; }
    .status-resolved { background: #28a745; color: white; padding: 3px 10px; border-radius: 20px; }
    .status-cancelled { background: #6c757d; color: white; padding: 3px 10px; border-radius: 20px; }
    
    .map-container {
        height: 300px;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 15px;
    }
    
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-top: 15px;
    }
    
    .stat-box {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 10px;
        text-align: center;
    }
    
    .stat-number {
        font-size: 2rem;
        font-weight: bold;
        color: #001F4D;
    }
    
    .timeline-item {
        position: relative;
        padding-left: 30px;
        padding-bottom: 20px;
        border-left: 2px solid #C9A94A;
        margin-left: 20px;
    }
    
    .timeline-dot {
        position: absolute;
        left: -9px;
        top: 0;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #C9A94A;
        border: 2px solid white;
    }
    
    .timeline-content {
        background: #f8f9fa;
        padding: 12px 15px;
        border-radius: 8px;
    }
    
    .btn-back {
        background: #6c757d;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
    }
    
    .btn-back:hover {
        background: #5a6268;
    }
    
    .loading {
        text-align: center;
        padding: 50px;
    }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
{% endblock %}

{% block content %}
<div class="detail-container">
    <div class="container">
        <div class="detail-card">
            <div class="detail-header">
                <h2 id="eventNumber">Chargement...</h2>
                <small id="eventDate"></small>
            </div>
            
            <div id="eventContent">
                <div class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Chargement...</span>
                    </div>
                    <p class="mt-3">Chargement des détails...</p>
                </div>
            </div>
            
            <div class="detail-section">
                <button class="btn-back" onclick="window.location.href='/'">
                    <i class="fas fa-arrow-left me-2"></i>Retour à l'accueil
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const eventId = {{ event_id }};
    let eventMap = null;
    
async function loadEventDetails() {
    try {
        // Appeler l'API JSON (avec /api/)
        const response = await fetch(`/api/rescue-events/${eventId}`);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const event = await response.json();
        displayEventDetails(event);
        
    } catch (error) {
        console.error('Erreur:', error);
        document.getElementById('eventContent').innerHTML = `
            <div class="alert alert-danger m-4">
                <i class="fas fa-exclamation-circle me-2"></i>
                Erreur lors du chargement des détails: ${error.message}
            </div>
        `;
    }
}
    
    function displayEventDetails(event) {
        document.getElementById('eventNumber').textContent = event.event_number;
        document.getElementById('eventDate').textContent = `Créé le ${formatDateTime(event.created_at)}`;
        
        const content = `
            <!-- Priorité et statut -->
            <div class="detail-section">
                <div class="row">
                    <div class="col-md-6">
                        <strong>Priorité:</strong>
                        <span class="priority-${event.priority}">${getPriorityText(event.priority)}</span>
                    </div>
                    <div class="col-md-6">
                        <strong>Statut:</strong>
                        <span class="status-${event.status}">${getStatusText(event.status)}</span>
                    </div>
                </div>
            </div>
            
            <!-- Informations générales -->
            <div class="detail-section">
                <h4 class="section-title"><i class="fas fa-info-circle me-2"></i>Informations générales</h4>
                <div class="info-row">
                    <div class="info-label">Type d'incident</div>
                    <div class="info-value">${event.event_type || 'Non spécifié'}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Description</div>
                    <div class="info-value">${event.description || 'Aucune description'}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Signalé par</div>
                    <div class="info-value">${event.reported_by || 'Inconnu'}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Date/Heure de l'incident</div>
                    <div class="info-value">${formatDateTime(event.incident_time)}</div>
                </div>
            </div>
            
            <!-- Localisation -->
            <div class="detail-section">
                <h4 class="section-title"><i class="fas fa-map-marker-alt me-2"></i>Localisation</h4>
                <div class="info-row">
                    <div class="info-label">Coordonnées</div>
                    <div class="info-value">${event.latitude.toFixed(6)}, ${event.longitude.toFixed(6)}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Distance de la côte</div>
                    <div class="info-value">${event.distance_coast_km ? event.distance_coast_km + ' km' : 'Non spécifiée'}</div>
                </div>
                <div id="eventMap" class="map-container"></div>
            </div>
            
            <!-- Personnes impliquées -->
            <div class="detail-section">
                <h4 class="section-title"><i class="fas fa-users me-2"></i>Personnes impliquées</h4>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-number">${event.persons_involved}</div>
                        <div class="stat-label">Impliquées</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number text-success">${event.persons_rescued}</div>
                        <div class="stat-label">Sauvées</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number text-danger">${event.persons_deceased || 0}</div>
                        <div class="stat-label">Décédées</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number text-warning">${event.persons_missing || 0}</div>
                        <div class="stat-label">Disparues</div>
                    </div>
                </div>
            </div>
            
            <!-- Historique -->
            ${event.updates && event.updates.length ? `
            <div class="detail-section">
                <h4 class="section-title"><i class="fas fa-history me-2"></i>Historique</h4>
                ${event.updates.map(update => `
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            <small class="text-muted">${formatDateTime(update.created_at)}</small>
                            <p class="mb-0 mt-1">${escapeHtml(update.content)}</p>
                        </div>
                    </div>
                `).join('')}
            </div>
            ` : ''}
        `;
        
        document.getElementById('eventContent').innerHTML = content;
        
        // Initialiser la carte
        initEventMap(event.latitude, event.longitude, event);
    }
    
    function initEventMap(lat, lng, event) {
        if (eventMap) {
            eventMap.remove();
        }
        
        eventMap = L.map('eventMap').setView([lat, lng], 12);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(eventMap);
        
        const priorityColors = {
            critical: '#7b1fa2',
            high: '#dc3545',
            normal: '#ffc107',
            low: '#28a745'
        };
        
        const color = priorityColors[event.priority] || '#007bff';
        
        const marker = L.marker([lat, lng]).addTo(eventMap);
        marker.bindPopup(`
            <b>${event.event_number}</b><br>
            ${event.event_type}<br>
            <span style="background:${color};color:white;padding:2px 8px;border-radius:4px">${event.priority}</span>
        `).openPopup();
    }
    
    function formatDateTime(dateStr) {
        if (!dateStr) return 'N/A';
        const date = new Date(dateStr);
        return date.toLocaleString('fr-FR');
    }
    
    function getPriorityText(priority) {
        const texts = {'critical': 'Critique', 'high': 'Élevée', 'normal': 'Normale', 'low': 'Faible'};
        return texts[priority] || priority;
    }
    
    function getStatusText(status) {
        const texts = {'active': 'Actif', 'resolved': 'Résolu', 'cancelled': 'Annulé', 'archived': 'Archivé'};
        return texts[status] || status;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Charger les détails
    loadEventDetails();
</script>
{% endblock %}
