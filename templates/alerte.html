{% extends "base.html" %}

{% block title %}Titre de ma page - MRCC Maroc{% endblock %}

{% block extra_css %}
<style>

.main-content {
      padding: 3rem 0;
      min-height: calc(100vh - 70px - 60px);
    }
    
    .hero {
      position: relative;
      overflow: hidden;
    }
    
    .hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    
    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.1;
    }
    
    .login-overlay {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      padding: 2.5rem;
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .login-overlay h2 {
      color: var(--primary-color);
      font-weight: 700;
      margin-bottom: 2rem;
      text-align: center;
      font-family: 'Manrope', sans-serif;
      position: relative;
      padding-bottom: 0.5rem;
    }
    
    .login-overlay h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: var(--accent-color);
    }
    
    /* Cards Container */
    .cards-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2rem;
      margin-top: 2rem;
    }
    
    /* Card Styles */
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 280px;
      height: 220px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 12px rgba(67, 97, 238, 0.1);
      text-decoration: none;
      color: var(--dark-color);
      transition: all 0.3s ease;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(67, 97, 238, 0.1);
    }
    
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(67, 97, 238, 0.15);
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: var(--primary-color);
    }
    
    .icon {
      font-size: 3.5rem;
      color: var(--primary-color);
      margin-bottom: 1rem;
      transition: all 0.3s;
    }
    
    .card:hover .icon {
      color: var(--secondary-color);
      transform: scale(1.1);
    }
    
    .card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
      color: var(--dark-color);
    }
    
    /* Notification Styles */
    .notification-icon {
      position: relative;
      cursor: pointer;
      color: white;
      font-size: 1.2rem;
    }
    
    .notification-count {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--danger-color);
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
    }
    
    .notification-list {
      position: absolute;
      top: 50px;
      right: 0;
      background: white;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      width: 300px;
      z-index: 1000;
      padding: 1rem;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .login-overlay {
        padding: 1.5rem;
      }
      
      .header .logo h1 {
        font-size: 1.3rem;
      }
      
      .cards-container {
        flex-direction: column;
        align-items: center;
      }
      
      .card {
        width: 100%;
        max-width: 350px;
      }
    }

    
  
</style>
{% endblock %}

{% block content %}

<main class="main-content">
  <section id="hero" class="hero section">
    <div class="hero-bg">
      <img src="{{ url_for('static', filename='img/hero-bg-light.webp') }}" alt="">
    </div>
    
    <div class="login-overlay" data-aos="fade-up">
      <h2><i class="fas fa-bell"></i> Alerts Management</h2>
      
      <div class="cards-container">
        <a href="{{ url_for('add_alerte') }}" class="card" data-aos="fade-up" data-aos-delay="100">
          <div class="icon">
            <i class="fas fa-plus-circle"></i>
          </div>
          <h2>Add Alert</h2>
        </a>
        
        <a href="{{ url_for('mes_alertes') }}" class="card" data-aos="fade-up" data-aos-delay="200">
          <div class="icon">
            <i class="fas fa-list-alt"></i>
          </div>
          <h2>Manage Alerts</h2>
        </a>
        
      </div>
    </div>
  </section>
</main>


  {% endblock %}

  {% block extra_js %}

  {% endblock %}
</html>
